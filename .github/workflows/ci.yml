name: Build and test
on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qmake6 qt6-base-dev qt6-declarative-dev
      - name: Fetch Rust dependencies
        run: cargo fetch --locked --manifest-path backend/Cargo.toml
      - name: Build
        run: bin/build
      - name: Test profile and credential handling
        run: python3 tests/backend_smoke.py
